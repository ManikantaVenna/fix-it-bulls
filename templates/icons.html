{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'bull' %}
    <path d="M2.5 3.5c-1.2 4.1 1 6.4 5.4 7.2l1.5 5a2.7 2.7 0 0 0 5.2 0l1.5-5c4.4-.8 6.6-3.1 5.4-7.2M5 7.5c1.9 1.7 4.3 2 7 2s5.1-.3 7-2"/>
  {% elif name == 'home' %}
    <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>
  {% elif name == 'plus' %}
    <rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8m-4-4h8"/>
  {% elif name == 'list' %}
    <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>
  {% elif name == 'pin' %}
    <path d="M19 10c0 5-7 10-7 10s-7-5-7-10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2.25"/>
  {% elif name == 'arrow' %}
    <path d="M4 12h15m-6-6 6 6-6 6"/>
  {% elif name == 'chevron' %}
    <path d="m9 6 6 6-6 6"/>
  {% elif name == 'camera' %}
    <path d="M4 7h4l2-3h4l2 3h4a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>
  {% elif name == 'mail' %}
    <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>
  {% elif name == 'info' %}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>
  {% elif name == 'upload' %}
    <path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"/>
  {% endif %}
</svg>
{%- endmacro %}
