<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fix It Bulls{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='reports.css') }}">
  <script src="{{ url_for('static', filename='reports.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="{{ url_for('reports.new') }}">Fix It Bulls<span>.</span></a>
      <nav aria-label="Main navigation">
        {% if session.get('user_id') %}
          <a href="{{ url_for('reports.history') }}">My reports</a>
          <form method="post" action="{{ url_for('auth.logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit">Sign out</button>
          </form>
        {% else %}
          <a href="{{ url_for('auth.start') }}">Sign in with Google</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
