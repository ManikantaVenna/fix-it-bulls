<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fix It Bulls{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='reports.css') }}">
  <script src="{{ url_for('static', filename='reports.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="{{ url_for('reports.new') }}">Fix It Bulls<span>.</span></a>
      <span class="campus">USF Tampa</span>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
